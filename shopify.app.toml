# This file stores configurations for your Shopify app.

# Populated by `shopify app config link` (Partner Dashboard → Apps → your app).
client_id = "9ff1c68995a15044cadb977894bad3a1"
name = "stocksense"
application_url = "https://stocksense-igb7.onrender.com"
embedded = true

[auth]
redirect_urls = [ "https://stocksense-igb7.onrender.com/auth/callback" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Must match SCOPES in your host's env vars (see .env.example).
scopes = "read_inventory,read_products,read_orders,read_locations,write_inventory,read_purchase_orders"

# Privacy policy / terms of service URLs are NOT configurable in this file —
# Shopify's app config schema has no such fields. They are set in the Partner
# Dashboard: App setup → App details → "Privacy policy URL" and
# "Terms of service URL". After deploying, enter:
#   https://<SHOPIFY_APP_URL>/privacy-policy.html
#   https://<SHOPIFY_APP_URL>/terms.html
# where <SHOPIFY_APP_URL> is the single base URL env var (see DEPLOY.md step 2).
# The app itself derives the same URLs in app/lib/config.ts.

[webhooks]
# Keep this in sync with ApiVersion in app/shopify.server.ts.
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]