# Render blueprint for StockSense — FREE tier (no credit card required, verified 2026).
# Docs: https://render.com/docs/blueprint-spec
#
# Persistence: the free web service has an ephemeral filesystem, so state lives
# in Postgres (Supabase free tier) via DATABASE_URL — sessions, settings and
# imports survive spin-downs, restarts and redeploys. A GitHub Actions ping
# (.github/workflows/keepalive.yml) keeps the service warm so merchants don't
# hit ~50s cold starts.
#
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint →
# select the repo. Fill the `sync: false` env vars in the dashboard.
services:
  - type: web
    name: stocksense
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run docker-start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard after the first deploy (secrets):
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Optional: custom shop domains (comma-separated) — see app/shopify.server.ts
      - key: SHOP_CUSTOM_DOMAIN
        sync: false