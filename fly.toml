# Fly.io config for StockSense — optional alternative host.
#
# Honest cost (2026): Fly.io removed its free tier for new customers (Oct 2024)
# and requires a credit card. A minimal app like this bills ~$2-3/mo
# (smallest shared-cpu machine); invoices under $5 are waived.
#
# Optional: the app keeps all state in Postgres (DATABASE_URL), so no volume
# is needed. Render free + Supabase free is the default $0 setup.
#
# Setup (from DEPLOY.md):
#   fly launch --no-deploy
#   fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... SCOPES=... SHOPIFY_APP_URL=... DATABASE_URL=...
#   fly deploy
app = "stocksense"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
