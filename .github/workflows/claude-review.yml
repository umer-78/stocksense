name: Claude Code Review

# Automatic AI review on every non-draft PR. Skips quietly (green) until an
# ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret exists, and on fork and
# Dependabot PRs, which never receive secrets.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip (no Claude secret configured)
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::Add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to enable Claude reviews."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow CLAUDE.md. Focus on:
            - Correctness bugs, especially in the forecast math (app/lib/forecast) and billing limits (app/lib/billing)
            - Security: Shopify auth, webhook HMAC handling, data the app stores
            - Missing or broken tests for changed logic
            - For docs/ (the marketing site): broken links, claims that do not match what the app does, SEO meta

            Be concise. Use inline comments for specific lines and one top-level
            `gh pr comment` for the summary. Do not comment on style a formatter handles.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
