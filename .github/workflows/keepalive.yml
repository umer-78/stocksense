name: Keep-alive

# Pings the deployed app every 5 minutes so the Render free instance stays
# warm (no ~50s cold start for merchants) and the free Postgres stays active.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz?db=1
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "https://stocksense-igb7.onrender.com/healthz?db=1"
