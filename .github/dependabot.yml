version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'weekly'
    # Dependabot defaults to 5 open pull requests at a time
    open-pull-requests-limit: 100

    # Cooldown is the number of days after a release to wait until opening a PR
    # This gives us more confidence changes can be merged because changes have been community tested.
    # See: https://github.blog/changelog/2025-07-01-dependabot-supports-configuration-of-a-minimum-package-age/
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14

    # Majors blocked by peer dependencies: @shopify/polaris 13 requires React 18,
    # @shopify/shopify-app-session-storage-prisma 10 requires Prisma 6, and
    # @remix-run/dev 2 requires Vite 5 or 6 (package.json also overrides vite to
    # ^6). These updates can only fail; upgrade them together with those packages.
    ignore:
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # Remix 2 packages accept TypeScript 5 only (peer dependency); 7 is the new
      # native compiler.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @remix-run/eslint-config 2 accepts only ESLint 8 (peer dependency).
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # The types follow the Node the app runs on (22: Dockerfile, render.yaml),
      # not the newest Node, so they cannot offer APIs production lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

    groups:

      # Group together PRs of dependant packages
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite:
        patterns:
          - 'vite'
          - 'vite-tsconfig-paths'
      # The app library and its session storage share @shopify/shopify-api and
      # must move to a new major together; one without the other cannot build.
      shopify-app:
        patterns:
          - '@shopify/shopify-app-remix'
          - '@shopify/shopify-app-session-storage-prisma'
      remix:
        patterns:
          - '@remix-run/dev'
          - '@remix-run/fs-routes'
          - '@remix-run/node'
          - '@remix-run/react'
          - '@remix-run/eslint-config'
          - '@remix-run/route-config'

      # Group all patch updates not accounted for in prior groups in a single PR.
      # This reduces the number of PRs to review and rebase.
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
